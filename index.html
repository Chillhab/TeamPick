<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TeamPick</title><meta name='theme-color' content='#2563eb'><link rel='manifest' href='manifest.json'><link rel='icon' href='icons/icon-192.png'><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto;margin:0;padding:24px;background:#f3f4f6}.card{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.row{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}.players{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr;max-height:300px;overflow:auto}.player{display:flex;gap:8px;align-items:center;border:1px solid #e5e7eb;border-radius:10px;padding:8px}.player.checked{background:#eef2ff;border-color:#c7d2fe}.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #e5e7eb;background:#fff}.btn{border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;background:#fff}.btn:hover{background:#f9fafb}textarea{width:100%;height:260px;border:1px solid #e5e7eb;border-radius:10px;padding:8px}</style></head><body><div class='card'><h1>TeamPick</h1><p>Volle Version – Spieler wählen, WhatsApp-Vorschau & Kopieren.</p><div class='row'><label><span>Datum</span><input id='date' type='date' class='btn'></label><label><span>Treffzeit</span><input id='meet' type='time' value='10:00' class='btn'></label><label><span>Anstoß</span><input id='start' type='time' value='11:00' class='btn'></label></div><label style='display:block;margin-top:10px;'><span>Ort / Adresse</span><input id='place' type='text' class='btn' placeholder='z. B. Legienstraße'></label><h3 style='margin-top:16px;'>Spieler <span id='counter' class='pill'>0 / 0</span></h3><div style='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;'><button class='btn pill' id='btnAll'>Alle</button><button class='btn pill' id='btnNone'>Keine</button><button class='btn pill' id='btnReset'>Zurücksetzen</button><input id='search' type='text' placeholder='Spieler suchen…' class='btn'></div><div style='display:flex; gap:8px; margin-top:8px;'><input id='newPlayer' type='text' class='btn' placeholder='Neuen Spieler hinzufügen' /><button id='btnAdd' class='btn'>+ Hinzufügen</button></div><div id='players' class='players' style='margin-top:10px;'></div><h3 style='margin-top:16px;'>Vorschau (WhatsApp)</h3><textarea id='preview' readonly></textarea><div style='display:flex;gap:8px;flex-direction:column;margin-top:8px;'><button id='btnCopy' class='btn'>In Zwischenablage kopieren</button><a id='btnWhatsApp' class='btn' target='_blank' rel='noreferrer'>In WhatsApp öffnen</a></div><p style='color:#6b7280;font-size:12px;margin-top:6px;'>Deine Daten bleiben lokal im Browser gespeichert.</p></div><script>const DEFAULT_PLAYERS=["Selim","Ahmed","Ömer","Davud","Haroun","Hamudei","Hamza","Arian","Laith","Julian","Joshua","Ali","Berat","Liam","Javier","Yussuf 1","Yussuf (Yusi)","Emir","Ibrahim","Miran"];const KEY="teampick_pwa_v1";const $=id=>document.getElementById(id);function loadState(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null;}catch{return null;}}function saveState(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch{}}function migrate(s){const base={date:"",meetTime:"10:00",startTime:"11:00",place:"",players:[...DEFAULT_PLAYERS],selected:[...DEFAULT_PLAYERS],query:"",newPlayer:"",editing:null};if(!s||typeof s!="object")return base;return {...base,...s,players:Array.isArray(s.players)&&s.players.length?s.players:base.players,selected:Array.isArray(s.selected)?s.selected:[...(Array.isArray(s.players)?s.players:base.players)]};}function pad2(n){return String(n).padStart(2,"0");}function formatDateGerman(v){if(!v)return"";try{const d=new Date(v+"T00:00:00");return pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"."+String(d.getFullYear()).slice(-2);}catch{return"";}}function formatTime(v){if(!v)return"";const[h,m="00"]=String(v).split(":" );return pad2(h)+":"+pad2(m);}function buildMessage(state){const lines=[];const dateText=state.date?formatDateGerman(state.date):"";const meet=formatTime(state.meetTime);const start=formatTime(state.startTime);if(dateText)lines.push("⚽ Spiel am "+dateText);if(state.place)lines.push("📍 "+state.place);if(meet)lines.push("⏰ Treffpunkt: "+meet+" Uhr");if(start)lines.push("🕚 Anstoß: "+start+" Uhr");lines.push("");const list=Array.isArray(state.selected)?state.selected:[];const total=Array.isArray(state.players)?state.players.length:list.length;lines.push("👥 Auswahl: "+list.length+" / "+total);if(list.length){lines.push("👕 Spieler:");list.forEach(n=>lines.push(n));}else{lines.push("👕 Spieler: (noch nicht ausgewählt)");}return lines.join("\n");}let state=migrate(loadState());function updateCounter(){const c=$("counter");c.textContent=(state.selected?.length||0)+" / "+(state.players?.length||0);}function renderPlayers(){const root=$("players");const q=$("search").value.trim().toLowerCase();root.innerHTML="";(state.players||[]).filter(n=>!q||n.toLowerCase().includes(q)).forEach(name=>{const checked=state.selected.includes(name);const isEditing=state.editing&&state.editing.name===name;const el=document.createElement(isEditing?"div":"label");el.className="player"+(checked?" checked":"");el.title=name;if(isEditing){const input=document.createElement("input");input.type="text";input.value=state.editing.value;input.onkeydown=e=>{if(e.key==="Enter")saveEdit();if(e.key==="Escape")cancelEdit();};input.oninput=e=>state.editing.value=e.target.value;el.appendChild(input);const saveBtn=document.createElement("button");saveBtn.className="btn pill";saveBtn.textContent="Speichern";saveBtn.onclick=saveEdit;el.appendChild(saveBtn);const cancelBtn=document.createElement("button");cancelBtn.className="btn pill";cancelBtn.textContent="Abbrechen";cancelBtn.onclick=cancelEdit;el.appendChild(cancelBtn);}else{const cb=document.createElement("input");cb.type="checkbox";cb.checked=checked;cb.onchange=()=>togglePlayer(name);el.appendChild(cb);const span=document.createElement("span");span.className="name";span.textContent=name;el.appendChild(span);const editBtn=document.createElement("button");editBtn.className="btn pill";editBtn.textContent="✎";editBtn.title="Bearbeiten";editBtn.onclick=()=>startEdit(name);el.appendChild(editBtn);const delBtn=document.createElement("button");delBtn.className="btn pill";delBtn.textContent="✕";delBtn.title="Entfernen";delBtn.onclick=()=>removePlayer(name);el.appendChild(delBtn);}root.appendChild(el);});updateCounter();}function renderPreview(){const msg=buildMessage(state);$("preview").value=msg;$("btnWhatsApp").href="https://wa.me/?text="+encodeURIComponent(msg);saveState(state);}function renderAll(){renderPlayers();renderPreview();}function togglePlayer(name){const i=state.selected.indexOf(name);if(i>=0)state.selected.splice(i,1);else state.selected.push(name);renderAll();}function normalizeName(s){return s.trim().replace(/\s+/g," ");}function addPlayer(){const name=normalizeName($("newPlayer").value);$("newPlayer").value="";if(!name)return;if(state.players.some(p=>p.toLowerCase()===name.toLowerCase()))return;state.players.push(name);if(!state.selected.includes(name))state.selected.push(name);renderAll();}function startEdit(name){state.editing={name,value:name};renderPlayers();}function cancelEdit(){state.editing=null;renderPlayers();}function saveEdit(){if(!state.editing)return;const oldName=state.editing.name;const newName=normalizeName(state.editing.value);if(!newName){cancelEdit();return;}if(state.players.some(p=>p.toLowerCase()===newName.toLowerCase()&&p!==oldName)){alert("Name existiert bereits.");return;}state.players=state.players.map(p=>p===oldName?newName:p);state.selected=state.selected.map(p=>p===oldName?newName:p);state.editing=null;renderAll();}function removePlayer(name){if(!confirm('Spieler "'+name+'" entfernen?'))return;state.players=state.players.filter(p=>p!==name);state.selected=state.selected.filter(p=>p!==name);renderAll();}$("btnAll").onclick=()=>{state.selected=[...state.players];renderAll();};$("btnNone").onclick=()=>{state.selected=[];renderAll();};$("btnReset").onclick=()=>{if(!confirm("Spielerliste auf Standard zurücksetzen?"))return;state.players=[...DEFAULT_PLAYERS];state.selected=[...DEFAULT_PLAYERS];renderAll();};$("btnAdd").onclick=addPlayer;$("newPlayer").addEventListener("keydown",e=>{if(e.key==="Enter")addPlayer();});$("search").addEventListener("input",renderPlayers);["date","meet","start","place"].forEach(id=>{$(id).addEventListener("input",()=>{if(id==="date")state.date=$(id).value;if(id==="meet")state.meetTime=$(id).value;if(id==="start")state.startTime=$(id).value;if(id==="place")state.place=$(id).value;renderPreview();});});$("btnCopy").onclick=async()=>{try{if(navigator?.clipboard?.writeText){await navigator.clipboard.writeText($("preview").value);$("btnCopy").textContent="✓ Kopiert";setTimeout(()=>$("btnCopy").textContent="In Zwischenablage kopieren",1200);return;}throw new Error("Clipboard API missing");}catch{try{const ta=document.createElement("textarea");ta.value=$("preview").value;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";ta.style.pointerEvents="none";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");document.body.removeChild(ta);if(ok){$("btnCopy").textContent="✓ Kopiert";setTimeout(()=>$("btnCopy").textContent="In Zwischenablage kopieren",1200);return;}throw new Error("execCommand failed");}catch{const el=$("preview");el.focus();el.select();$("btnCopy").textContent="Markiert – bitte kopieren";setTimeout(()=>$("btnCopy").textContent="In Zwischenablage kopieren",2500);}}};(function init(){state=migrate(loadState());renderAll();})();</script></body></html>
